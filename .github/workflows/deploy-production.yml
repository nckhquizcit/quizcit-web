name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: quizcit-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/quizcit_deploy_key"

          chmod 600 "$HOME/.ssh/quizcit_deploy_key"

          ssh-keyscan -H "$VPS_HOST" \
            >> "$HOME/.ssh/known_hosts"

      - name: Deploy frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/quizcit_deploy_key" \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "/opt/quizcit/deploy/deploy-frontend.sh"
